<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Image Extractor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #6b7684;
    --accent: #2563eb; --border: #dfe3e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b2027; --text: #e8ecf1; --muted: #93a0ae;
      --accent: #5b8cff; --border: #2c343f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .drop {
    display: block; padding: 28px 16px; text-align: center; cursor: pointer;
    background: var(--card); border: 2px dashed var(--border); border-radius: 14px;
    transition: border-color .15s;
  }
  .drop.over { border-color: var(--accent); }
  .drop input { display: none; }
  .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 13px; word-break: break-all; }
  .options {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px; margin: 16px 0;
  }
  label.opt { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  select, input[type=number] {
    padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 15px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 12px 18px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  progress { width: 100%; height: 8px; margin-top: 16px; display: none; }
  #status { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 20px; }
  #status.error { color: #dc2626; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px; margin-top: 18px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .card img {
    width: 100%; height: 130px; object-fit: contain; border-radius: 8px;
    background: repeating-conic-gradient(#8883 0% 25%, transparent 0% 50%) 50% / 14px 14px;
  }
  .cap { font-size: 12px; color: var(--muted); word-break: break-all; }
  .card a {
    text-align: center; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff; text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>PDF Image Extractor</h1>
  <p class="sub">Runs entirely in your browser. Your PDF is never uploaded.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf,.pdf">
    <strong>Tap to choose a PDF</strong>
    <span id="fileName">or drag and drop it here</span>
  </label>

  <div class="options">
    <label class="opt">Mode
      <select id="mode">
        <option value="embedded">Extract embedded images</option>
        <option value="pages">Render each page as an image</option>
      </select>
    </label>
    <label class="opt" id="minWrap">Ignore images smaller than (px)
      <input type="number" id="minSize" value="50" min="0" step="10">
    </label>
    <label class="opt" id="scaleWrap" style="display:none">Page image quality
      <select id="scale">
        <option value="1">Normal (1x)</option>
        <option value="2" selected>High (2x)</option>
        <option value="3">Very high (3x)</option>
      </select>
    </label>
  </div>

  <div class="actions">
    <button id="runBtn" disabled>Extract</button>
    <button id="zipBtn" class="secondary" disabled>Download all (ZIP)</button>
  </div>

  <progress id="bar" value="0" max="1"></progress>
  <div id="status"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const $ = id => document.getElementById(id);
let file = null, results = [], workerPromise = null;

/* ---------- UI wiring ---------- */
$("file").addEventListener("change", e => setFile(e.target.files[0]));
$("mode").addEventListener("change", () => {
  const pages = $("mode").value === "pages";
  $("minWrap").style.display = pages ? "none" : "";
  $("scaleWrap").style.display = pages ? "" : "none";
});
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));
$("runBtn").addEventListener("click", run);
$("zipBtn").addEventListener("click", downloadZip);

function setFile(f) {
  if (!f) return;
  if (f.type !== "application/pdf" && !f.name.toLowerCase().endsWith(".pdf")) {
    return setStatus("Please choose a PDF file.", true);
  }
  file = f;
  $("fileName").textContent = f.name;
  $("runBtn").disabled = false;
  setStatus("");
}
function setStatus(msg, isError) {
  const s = $("status");
  s.textContent = msg;
  s.className = isError ? "error" : "";
}
function setProgress(v) {
  const b = $("bar");
  b.style.display = v == null ? "none" : "block";
  if (v != null) b.value = v;
}

/* ---------- PDF.js worker (loaded via blob so it works from a local file) ---------- */
function initWorker() {
  if (!workerPromise) {
    workerPromise = (async () => {
      const r = await fetch(BASE + "pdf.worker.min.js");
      if (!r.ok) throw new Error("Could not load the PDF engine. Check your internet connection.");
      const blob = new Blob([await r.text()], { type: "text/javascript" });
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    })().catch(err => { workerPromise = null; throw err; });
  }
  return workerPromise;
}

/* ---------- Helpers ---------- */
const pad = (n, len = 3) => String(n).padStart(len, "0");
const baseName = () => file.name.replace(/\.pdf$/i, "");
const toBlob = c => new Promise(res => c.toBlob(res, "image/png"));

function clearResults() {
  results.forEach(r => URL.revokeObjectURL(r.url));
  results = [];
  $("grid").innerHTML = "";
  $("zipBtn").disabled = true;
}

function addResult(name, blob, dims) {
  const url = URL.createObjectURL(blob);
  results.push({ name, blob, url });

  const card = document.createElement("div");
  card.className = "card";
  const im = new Image();
  im.src = url; im.alt = name;
  const cap = document.createElement("div");
  cap.className = "cap";
  cap.textContent = name + " · " + dims;
  const a = document.createElement("a");
  a.href = url; a.download = name; a.textContent = "Download";
  card.append(im, cap, a);
  $("grid").appendChild(card);
}

function getObj(page, name) {
  const store = name.startsWith("g_") ? page.commonObjs : page.objs;
  const p = new Promise(res => {
    try { store.get(name, o => res(o)); } catch (e) { res(null); }
  });
  const timeout = new Promise(res => setTimeout(() => res(null), 5000));
  return Promise.race([p, timeout]);
}

async function imageToBlob(img) {
  const w = img.width, h = img.height;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");

  if (img.bitmap) {
    ctx.drawImage(img.bitmap, 0, 0);
  } else if (img.data) {
    const out = ctx.createImageData(w, h);
    const d = out.data, s = img.data;
    const K = pdfjsLib.ImageKind;
    if (img.kind === K.RGBA_32BPP) {
      d.set(s.subarray(0, w * h * 4));
    } else if (img.kind === K.RGB_24BPP) {
      for (let p = 0, q = 0; p < w * h * 3; p += 3, q += 4) {
        d[q] = s[p]; d[q + 1] = s[p + 1]; d[q + 2] = s[p + 2]; d[q + 3] = 255;
      }
    } else if (img.kind === K.GRAYSCALE_1BPP) {
      const rowBytes = (w + 7) >> 3;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const bit = (s[y * rowBytes + (x >> 3)] >> (7 - (x & 7))) & 1;
          const v = bit ? 255 : 0, q = (y * w + x) * 4;
          d[q] = d[q + 1] = d[q + 2] = v; d[q + 3] = 255;
        }
      }
    } else {
      return null;
    }
    ctx.putImageData(out, 0, 0);
  } else {
    return null;
  }
  return toBlob(c);
}

/* ---------- Main ---------- */
async function run() {
  if (!file) return;
  $("runBtn").disabled = true;
  clearResults();
  setProgress(0);
  setStatus("Loading PDF…");

  try {
    await initWorker();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    if ($("mode").value === "pages") await renderPages(pdf);
    else await extractEmbedded(pdf);

    if (results.length) {
      $("zipBtn").disabled = false;
      setStatus("Done. " + results.length + " image" + (results.length === 1 ? "" : "s") + " found.");
    } else {
      setStatus("No embedded images found. Try the “Render each page as an image” mode.");
    }
  } catch (err) {
    console.error(err);
    setStatus("Error: " + (err.message || err), true);
  } finally {
    setProgress(null);
    $("runBtn").disabled = false;
  }
}

async function extractEmbedded(pdf) {
  const OPS = pdfjsLib.OPS;
  const minSize = Math.max(0, parseInt($("minSize").value, 10) || 0);
  const seen = new Set();
  let n = 0;

  for (let i = 1; i <= pdf.numPages; i++) {
    setStatus("Scanning page " + i + " of " + pdf.numPages + "…");
    setProgress((i - 1) / pdf.numPages);

    const page = await pdf.getPage(i);
    const ops = await page.getOperatorList();

    for (let k = 0; k < ops.fnArray.length; k++) {
      const fn = ops.fnArray[k];
      let img = null;

      if (fn === OPS.paintImageXObject || fn === OPS.paintJpegXObject) {
        const key = ops.argsArray[k][0];
        if (seen.has(key)) continue;
        seen.add(key);
        img = await getObj(page, key);
      } else if (fn === OPS.paintInlineImageXObject) {
        img = ops.argsArray[k][0];
      } else {
        continue;
      }

      if (!img || img.width < minSize || img.height < minSize) continue;
      const blob = await imageToBlob(img);
      if (!blob) continue;

      n++;
      addResult(baseName() + "-img-" + pad(n) + ".png", blob, img.width + "×" + img.height + " (page " + i + ")");
    }
    page.cleanup();
  }
}

async function renderPages(pdf) {
  const scale = parseFloat($("scale").value) || 2;
  for (let i = 1; i <= pdf.numPages; i++) {
    setStatus("Rendering page " + i + " of " + pdf.numPages + "…");
    setProgress((i - 1) / pdf.numPages);

    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.floor(vp.width);
    c.height = Math.floor(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;

    const blob = await toBlob(c);
    addResult(baseName() + "-page-" + pad(i) + ".png", blob, c.width + "×" + c.height);
    page.cleanup();
  }
}

async function downloadZip() {
  if (!results.length) return;
  $("zipBtn").disabled = true;
  setStatus("Building ZIP…");
  try {
    const zip = new JSZip();
    results.forEach(r => zip.file(r.name, r.blob));
    const blob = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = baseName() + "-images.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus("ZIP ready.");
  } catch (err) {
    setStatus("Could not build ZIP: " + err.message, true);
  } finally {
    $("zipBtn").disabled = false;
  }
}
</script>
</body>
</html>
