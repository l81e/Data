<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Flashcards — MedicineBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --bg:            #0b0b0b;
    --panel:         #161616;
    --panel-hi:      #1e1e1e;
    --line:          #2b2b2b;
    --line-soft:     #232323;

    --text:          #f2f2f2;
    --text-dim:      #a8a8a8;
    --text-faint:    #6b6b6b;

    --accent:        #e8e8e8;
    --accent-dark:   #ffffff;
    --accent-glow:   rgba(255,255,255,0.08);
    --err:           #c7c7c7;

    --today-green:   #3ba55c;
    --today-green-hi:#46bd68;
  }

  html,body{
    height:100%;
    /* Hard block on pinch/double-tap zoom everywhere */
    touch-action:pan-y;
    -ms-touch-action:pan-y;
    overscroll-behavior:none;
  }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    position:relative;
    /* Fixed viewport frame — this is what lets the card claim the
       leftover space below the header instead of shrink-wrapping it. */
    height:100vh;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    -webkit-text-size-adjust:none;
    text-size-adjust:none;
  }
  html[dir="rtl"] body{font-family:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}

  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; touch-action:manipulation;}

  /* ---------- HEADER (matches parent) ---------- */
  .site-header{
    position:relative; z-index:30;
    padding:20px 40px 4px;
    display:flex; align-items:flex-start; justify-content:space-between;
    flex-shrink:0;
  }
  .header-left{display:flex; flex-direction:column; align-items:flex-start; gap:2px;}
  .logo-wrap{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .logo-img{height:28px; width:auto; display:block;}
  .logo-fallback{
    display:flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:6px;
    border:1px solid var(--line-soft);
    font-weight:800; font-size:0.72rem; letter-spacing:0.2px; color:var(--text);
  }

  .back-link{
    display:flex; align-items:center; gap:7px;
    border:1px solid var(--line-soft); border-radius:20px;
    padding:8px 16px 8px 14px; cursor:pointer;
    background:transparent; color:var(--text-dim);
    font-size:0.78rem; font-weight:700;
    transition:border-color .15s, color .15s;
  }
  html[dir="rtl"] .back-link{padding:8px 14px 8px 16px; flex-direction:row-reverse;}
  .back-link:hover{border-color:var(--text-dim); color:var(--text);}
  .back-link svg{width:14px; height:14px; flex-shrink:0;}
  html[dir="rtl"] .back-link svg{transform:scaleX(-1);}

  .header-right{display:flex; align-items:center; gap:8px;}
  html[dir="rtl"] .header-right{flex-direction:row-reverse;}

  /* settings (gear) button — replaces old lang-switch + holds lang + view mode */
  .settings-btn{
    width:34px; height:34px; border-radius:50%;
    background:transparent; border:1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-faint);
    transition:border-color .15s, color .15s;
    flex-shrink:0;
    position:relative;
  }
  .settings-btn:hover{border-color:var(--text-faint); color:var(--text-dim);}
  .settings-btn svg{width:16px; height:16px;}

  /* settings dropdown panel */
  .settings-panel{
    position:absolute;
    top:42px;
    right:0;
    min-width:190px;
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:6px;
    display:none;
    flex-direction:column;
    gap:2px;
    z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  html[dir="rtl"] .settings-panel{right:auto; left:0;}
  .settings-panel.open{display:flex;}
  .settings-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 10px; border-radius:8px;
    font-size:0.78rem; font-weight:700; color:var(--text-dim);
    cursor:pointer;
  }
  .settings-item:hover{background:var(--panel-hi); color:var(--text);}
  .settings-item.active-row{color:var(--text);}
  .settings-item svg{width:15px; height:15px; flex-shrink:0;}
  .settings-item .row-label{display:flex; align-items:center; gap:9px;}
  .settings-divider{height:1px; background:var(--line-soft); margin:4px 2px;}
  .settings-check{width:14px; height:14px; color:var(--text-faint); flex-shrink:0; visibility:hidden;}
  .settings-item.active-row .settings-check{visibility:visible; color:var(--text);}

  /* ---------- DECK TITLE HERO ---------- */
  .deck-hero{
    position:relative; z-index:2;
    padding:6px 40px 18px;
    text-align:left;
    flex-shrink:0;
  }
  html[dir="rtl"] .deck-hero{text-align:right;}
  .deck-title{
    font-weight:700;
    font-size:clamp(1.4rem, 5vw, 2rem);
    letter-spacing:-0.02em;
    line-height:1.2;
    word-break:break-word;
  }
  html[dir="rtl"] .deck-title{font-family:'Cairo',sans-serif;}
  .deck-sub{font-size:0.8rem; color:var(--text-faint); margin-top:6px;}

  .progress-row{
    display:flex; align-items:center; gap:10px;
    margin-top:14px;
  }
  .progress-track{
    flex:1; height:5px; border-radius:4px;
    background:var(--line-soft); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:4px;
    background:var(--text);
    width:0%;
    transition:width .25s ease;
  }
  .progress-count{
    font-size:0.72rem; color:var(--text-faint); font-weight:700;
    white-space:nowrap;
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative; z-index:2;
    width:100%;
    max-width:720px; margin:0 auto;
    padding:0 24px 24px;
    /* main is the flexible region below the header/hero: it must take
       all remaining viewport height, and min-height:0 is required or
       flex children will refuse to shrink below their content size. */
    display:flex; flex-direction:column;
    flex:1 1 auto;
    min-height:0;
  }

  .loading-row{text-align:center; padding:70px 20px; color:var(--text-faint); font-size:0.85rem; margin:auto;}
  .loading-row .spin-icon{
    width:26px; height:26px; margin:0 auto 16px;
    border:2px solid var(--line-soft); border-top-color:var(--text-dim);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-row{
    text-align:center; padding:50px 24px 60px; color:var(--text-dim); margin:auto;
  }
  .error-row .big-icon{font-size:2rem; margin-bottom:14px; opacity:0.6;}
  .error-row h3{font-size:1rem; font-weight:700; margin-bottom:8px; color:var(--text);}
  .error-row p{font-size:0.85rem; max-width:420px; margin:0 auto; line-height:1.7; color:var(--text-faint);}
  .error-row .err-hint{
    margin-top:18px; display:inline-block;
    font-size:0.76rem; color:var(--text-faint);
    border:1px solid var(--line-soft); border-radius:8px;
    padding:10px 14px; text-align:left; line-height:1.6;
  }
  html[dir="rtl"] .error-row .err-hint{text-align:right;}

  /* ---------- STUDY VIEW WRAPPER ---------- */
  .study-view{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  /* ---------- FLASHCARD ---------- */
  .card-stage{
    position:relative;
    perspective:1600px;
    margin-bottom:16px;
    touch-action:pan-y;
    flex:1;
    min-height:0;
    display:flex;
  }
  .flip-card{
    position:relative;
    width:100%;
    flex:1;
    min-height:0;
    cursor:pointer;
  }
  .flip-card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .38s cubic-bezier(.4,0,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.is-flipped .flip-card-inner{transform:rotateY(180deg);}
  html[dir="rtl"] .flip-card.is-flipped .flip-card-inner{transform:rotateY(-180deg);}

  .flip-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:22px 20px;
    display:flex; flex-direction:column;
    /* This face is the scroll container — fills the whole card height */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    height:100%;
  }
  .flip-face.face-back{transform:rotateY(180deg);}
  html[dir="rtl"] .flip-face.face-back{transform:rotateY(-180deg);}

  .flip-face-label{
    font-size:0.66rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-faint); margin-bottom:14px; flex-shrink:0;
  }
  .flip-face-content{
    /* .flip-face is a flex column with overflow-y:auto. Without
       flex-shrink:0 here, a flex child is allowed to be squashed down
       to fit the visible box instead of overflowing it — which is
       exactly why long text wasn't scrollable before. This forces the
       content to keep its natural (possibly tall) height so the
       parent's overflow-y:auto has something to actually scroll. */
    flex-shrink:0;
    font-size:1.02rem; line-height:1.65; color:var(--text);
    word-break:break-word;
  }
  .flip-face-content img{
    max-width:100%; height:auto; border-radius:8px;
    margin:10px 0; display:block;
    border:1px solid var(--line-soft);
  }
  .flip-face-content audio{
    width:100%; margin:10px 0;
    height:36px;
  }
  .flip-face-content b, .flip-face-content strong{color:var(--text); font-weight:700;}
  .flip-face-content .cloze-blank{
    color:var(--text);
    background:var(--accent-glow);
    border-radius:4px;
    padding:1px 6px;
    font-weight:700;
  }
  .flip-face-content table{
    width:100%; border-collapse:collapse; margin:10px 0; font-size:0.92rem;
  }
  .flip-face-content td, .flip-face-content th{
    border:1px solid var(--line-soft); padding:6px 9px; text-align:left;
  }
  html[dir="rtl"] .flip-face-content td, html[dir="rtl"] .flip-face-content th{text-align:right;}
  .flip-face-content hr{border:none; border-top:1px solid var(--line-soft); margin:14px 0;}
  .flip-face-content ul, .flip-face-content ol{padding-left:22px; margin:8px 0;}
  html[dir="rtl"] .flip-face-content ul, html[dir="rtl"] .flip-face-content ol{padding-left:0; padding-right:22px;}

  .tap-hint{
    text-align:center; font-size:0.72rem; color:var(--text-faint);
    margin-bottom:14px;
    flex-shrink:0;
  }

  /* ---------- NAV CONTROLS ---------- */
  .nav-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:6px;
    flex-shrink:0;
  }
  .nav-btn{
    width:46px; height:46px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-dim);
    transition:border-color .15s, color .15s, opacity .15s;
    flex-shrink:0;
  }
  .nav-btn:hover:not(:disabled){border-color:var(--text-dim); color:var(--text);}
  .nav-btn:disabled{opacity:0.3; cursor:not-allowed;}
  .nav-btn svg{width:18px; height:18px;}
  html[dir="rtl"] .nav-btn.nav-prev svg{transform:scaleX(-1);}
  html[dir="rtl"] .nav-btn.nav-next svg{transform:scaleX(-1);}

  .flip-btn{
    flex:1; max-width:220px;
    height:46px; border-radius:23px;
    background:var(--text); color:var(--bg);
    border:none; cursor:pointer;
    font-size:0.85rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s;
  }
  .flip-btn:hover{background:var(--text-dim);}
  .flip-btn svg{width:15px; height:15px;}

  /* ---------- DECK LIST (browse all / jump to card) ---------- */
  .browse-view{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  .card-list{display:flex; flex-direction:column; gap:8px;}
  .card-list-item{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:10px;
    padding:13px 16px;
    cursor:pointer;
    display:flex; align-items:center; gap:12px;
    transition:border-color .15s;
  }
  .card-list-item:hover{border-color:var(--text-faint);}
  .card-list-num{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background:var(--panel-hi); border:1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:0.7rem; font-weight:800; color:var(--text-faint);
  }
  .card-list-text{
    flex:1; min-width:0; font-size:0.86rem; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-list-text img{display:none;}
  .card-list-chevron{flex-shrink:0; width:14px; height:14px; color:var(--text-faint);}
  html[dir="rtl"] .card-list-chevron{transform:scaleX(-1);}

  @media (max-width:560px){
    .site-header{padding:16px 18px 4px;}
    .deck-hero{padding:6px 18px 16px;}
    main{padding:0 14px 16px;}
    .flip-face{padding:18px 16px;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <div class="logo-wrap">
      <img src="IMG_3083.png" alt="MedicineBank" class="logo-img" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';" />
      <div class="logo-fallback" id="logoFallback" style="display:none;">MB</div>
    </div>
  </div>
  <div class="header-right">
    <button type="button" class="back-link" id="backLinkBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-en="Back" data-ar="رجوع">Back</span>
    </button>
    <button type="button" class="settings-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-item" id="modeStudyRow" data-mode="study">
          <span class="row-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>
            <span data-en="Study" data-ar="مذاكرة">Study</span>
          </span>
          <svg class="settings-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="settings-item" id="modeBrowseRow" data-mode="browse">
          <span class="row-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            <span data-en="Browse all" data-ar="كل البطاقات">Browse all</span>
          </span>
          <svg class="settings-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-item" id="langToggleRow">
          <span class="row-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/></svg>
            <span id="langToggleLabel" data-en="Language: English" data-ar="اللغة: عربي">Language: English</span>
          </span>
        </div>
      </div>
    </button>
  </div>
</header>

<section class="deck-hero">
  <div class="deck-title" id="deckTitle">—</div>
  <div class="deck-sub" id="deckSub"></div>
  <div class="progress-row" id="progressRow" style="display:none;">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-count" id="progressCount">0 / 0</div>
  </div>
</section>

<main id="mainEl">
  <div class="loading-row" id="loadingRow">
    <div class="spin-icon"></div>
    <div data-en="Opening flashcards…" data-ar="بيفتح البطاقات…">Opening flashcards…</div>
  </div>
</main>

<script>
(function(){
  const htmlEl = document.documentElement;
  let currentLang = 'en';

  const LANG_LS_KEY = 'mb_lang';
  function getStoredLang(){
    try {
      const v = localStorage.getItem(LANG_LS_KEY);
      return (v === 'en' || v === 'ar') ? v : null;
    } catch (e) { return null; }
  }
  function setStoredLang(v){ try { localStorage.setItem(LANG_LS_KEY, v); } catch (e) {} }

  function applyStaticText(lang){
    document.querySelectorAll('[data-en]').forEach(el => {
      const t = lang === 'ar' ? el.dataset.ar : el.dataset.en;
      if (t != null) el.textContent = t;
    });
  }

  function updateLangLabel(){
    const label = document.getElementById('langToggleLabel');
    if (!label) return;
    label.dataset.en = currentLang === 'en' ? 'Language: English' : 'Language: English';
    // Always show what tapping will switch TO, and reflect current state clearly
    if (currentLang === 'en'){
      label.textContent = 'Language: English';
    } else {
      label.textContent = 'اللغة: عربي';
    }
  }

  function setLang(lang, skipPersist){
    currentLang = lang;
    if (!skipPersist) setStoredLang(lang);
    htmlEl.setAttribute('lang', lang);
    htmlEl.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    applyStaticText(lang);
    updateLangLabel();
    renderProgress();
  }

  /* ---------------- settings dropdown ---------------- */
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');

  function closeSettings(){ settingsPanel.classList.remove('open'); }
  function toggleSettings(e){
    e.stopPropagation();
    settingsPanel.classList.toggle('open');
  }
  settingsBtn.addEventListener('click', toggleSettings);
  document.addEventListener('click', (e) => {
    if (!settingsBtn.contains(e.target)) closeSettings();
  });

  document.getElementById('langToggleRow').addEventListener('click', (e) => {
    e.stopPropagation();
    setLang(currentLang === 'en' ? 'ar' : 'en');
  });

  document.getElementById('modeStudyRow').addEventListener('click', (e) => {
    e.stopPropagation();
    closeSettings();
    if (typeof renderStudyMode === 'function' && deckCards.length) renderStudyMode();
  });
  document.getElementById('modeBrowseRow').addEventListener('click', (e) => {
    e.stopPropagation();
    closeSettings();
    if (typeof renderBrowseMode === 'function' && deckCards.length) renderBrowseMode();
  });

  function updateModeCheckmarks(){
    document.getElementById('modeStudyRow').classList.toggle('active-row', viewMode === 'study');
    document.getElementById('modeBrowseRow').classList.toggle('active-row', viewMode === 'browse');
  }

  /* ---------------- back navigation ---------------- */
  document.getElementById('backLinkBtn').addEventListener('click', () => {
    if (document.referrer && document.referrer.indexOf(window.location.hostname) !== -1) {
      window.history.back();
    } else {
      window.location.href = '/';
    }
  });

  /* ---------------- Anti-zoom hardening ---------------- */
  // Belt-and-suspenders on top of the viewport meta tag + touch-action CSS:
  // block pinch gestures, ctrl/cmd + wheel zoom, and iOS Safari's
  // "gesturestart" pinch-zoom, plus swallow any accidental double-tap zoom.
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('gestureend', (e) => e.preventDefault());

  document.addEventListener('wheel', (e) => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive:false });

  // Prevent iOS double-tap-to-zoom without breaking single taps/clicks.
  // We only block the SECOND tap of a fast double-tap on touch devices;
  // real double-taps on buttons still fire a single click reliably since
  // the first tap's click always goes through.
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive:false });

  /* ---------------- Supabase ---------------- */
  const SUPABASE_URL = 'https://igfooetzorzhhvpakgqa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnZm9vZXR6b3J6aGh2cGFrZ3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODg2NTksImV4cCI6MjEwNDU2NDY1OX0.1XLeeRi4KFJptk73JKx_vs0FlO5EXM17KIyFSaKWLCA';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function getQueryParam(name){
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  const mainEl = document.getElementById('mainEl');
  const deckTitle = document.getElementById('deckTitle');
  const deckSub = document.getElementById('deckSub');
  const progressRow = document.getElementById('progressRow');
  const progressFill = document.getElementById('progressFill');
  const progressCount = document.getElementById('progressCount');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function renderErrorState(titleEn, titleAr, bodyEn, bodyAr, hintEn, hintAr){
    deckTitle.textContent = currentLang==='ar' ? 'مشكلة في الملف' : 'Trouble opening deck';
    deckSub.textContent = '';
    progressRow.style.display = 'none';
    let hintHtml = '';
    if (hintEn){
      hintHtml = `<div class="err-hint">${currentLang==='ar'?escapeHtml(hintAr):escapeHtml(hintEn)}</div>`;
    }
    mainEl.innerHTML = `
      <div class="error-row">
        <div class="big-icon">⚠️</div>
        <h3>${currentLang==='ar'?escapeHtml(titleAr):escapeHtml(titleEn)}</h3>
        <p>${currentLang==='ar'?escapeHtml(bodyAr):escapeHtml(bodyEn)}</p>
        ${hintHtml}
      </div>
    `;
  }

  /* ---------------- state ---------------- */
  let deckCards = [];       // [{ front, back, id }]
  let currentIndex = 0;
  let viewMode = 'study';   // 'study' | 'browse'
  let isAnimatingNav = false; // guards against rapid multi-step swipes/taps

  /* ---------------- HTML template rendering (Anki field substitution) ---------------- */
  function fillTemplate(tpl, fieldMap){
    let out = tpl;

    out = out.replace(/{{#([^}]+)}}([\s\S]*?){{\/\1}}/g, (m, field, inner) => {
      const val = fieldMap[field.trim()];
      return (val && val.trim() !== '') ? inner : '';
    });
    out = out.replace(/{{\^([^}]+)}}([\s\S]*?){{\/\1}}/g, (m, field, inner) => {
      const val = fieldMap[field.trim()];
      return (!val || val.trim() === '') ? inner : '';
    });

    out = out.replace(/{{([a-zA-Z0-9_:]+)}}/g, (m, ref) => {
      let field = ref;
      if (ref.indexOf(':') !== -1) field = ref.split(':').pop();
      if (field === 'FrontSide') return '__FRONTSIDE__';
      return fieldMap[field] != null ? fieldMap[field] : '';
    });

    return out;
  }

  function stripUnresolvedTags(str){
    return str.replace(/{{[^}]*}}/g, '');
  }

  /* ---------------- Cloze handling ---------------- */
  function renderCloze(text, ordinal, isBack){
    return text.replace(/{{c(\d+)::(.*?)}}/gs, (m, num, body) => {
      const n = parseInt(num, 10);
      const parts = body.split('::');
      const answer = parts[0];
      const hint = parts[1];
      if (n === ordinal){
        if (isBack){
          return `<span class="cloze-blank">${answer}</span>`;
        }
        return `<span class="cloze-blank">${hint ? '[' + hint + ']' : '[...]'}</span>`;
      }
      return answer;
    });
  }

  /* ---------------- Media URL rewriting ---------------- */
  function rewriteMediaRefs(html, mediaUrlMap){
    return html.replace(/(src|SRC)=(["'])([^"']+)\2/g, (m, attr, quote, fname) => {
      const decoded = decodeURIComponent(fname);
      const url = mediaUrlMap[fname] || mediaUrlMap[decoded];
      if (url) return `${attr}=${quote}${url}${quote}`;
      return m;
    });
  }

  /* ---------------- .apkg parsing ---------------- */
  async function parseApkg(arrayBuffer){
    const zip = await JSZip.loadAsync(arrayBuffer);

    const hasLatest = !!zip.file('collection.anki21b');
    const dbFile = zip.file('collection.anki21') || zip.file('collection.anki2');

    if (!dbFile){
      if (hasLatest){
        throw { code: 'LATEST_FORMAT' };
      }
      throw { code: 'NO_DB' };
    }

    let mediaMap = {};
    const mediaFile = zip.file('media');
    if (mediaFile){
      try {
        const mediaText = await mediaFile.async('string');
        mediaMap = JSON.parse(mediaText);
      } catch (e) { /* no media */ }
    }

    const mediaUrlMap = {};
    const mediaEntries = Object.entries(mediaMap);
    for (const [num, realName] of mediaEntries){
      const f = zip.file(num);
      if (!f) continue;
      const blob = await f.async('blob');
      const url = URL.createObjectURL(blob);
      mediaUrlMap[realName] = url;
    }

    const dbBytes = await dbFile.async('uint8array');

    const SQL = await initSqlJs({
      locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`
    });
    const db = new SQL.Database(dbBytes);

    const colRes = db.exec("SELECT models, decks FROM col LIMIT 1");
    if (!colRes || !colRes.length){
      throw { code: 'BAD_DB' };
    }
    const modelsJson = colRes[0].values[0][0];
    let models;
    try {
      models = JSON.parse(modelsJson);
    } catch (e){
      throw { code: 'BAD_DB' };
    }

    const notesRes = db.exec("SELECT id, mid, flds FROM notes");
    const notes = (notesRes.length ? notesRes[0].values : []).map(row => ({
      id: row[0], mid: String(row[1]), flds: row[2]
    }));

    const cardsRes = db.exec("SELECT id, nid, ord FROM cards ORDER BY id ASC");
    const cardRows = (cardsRes.length ? cardsRes[0].values : []).map(row => ({
      id: row[0], nid: row[1], ord: row[2]
    }));

    const notesById = {};
    notes.forEach(n => { notesById[n.id] = n; });

    const cards = [];

    for (const cardRow of cardRows){
      const note = notesById[cardRow.nid];
      if (!note) continue;
      const model = models[note.mid];
      if (!model) continue;

      const fieldNames = model.flds.map(f => f.name);
      const fieldValues = note.flds.split('\x1f');
      const fieldMap = {};
      fieldNames.forEach((name, i) => { fieldMap[name] = fieldValues[i] || ''; });

      const isCloze = model.type === 1;
      const tmpl = model.tmpls[cardRow.ord];
      if (!tmpl) continue;

      let frontHtml, backHtml;

      if (isCloze){
        const clozeOrdinal = cardRow.ord + 1;
        const clozeFieldMatch = tmpl.qfmt.match(/{{cloze:([^}]+)}}/);
        const clozeFieldName = clozeFieldMatch ? clozeFieldMatch[1] : (fieldNames[0] || '');
        const rawField = fieldMap[clozeFieldName] || '';

        frontHtml = renderCloze(rawField, clozeOrdinal, false);
        backHtml = renderCloze(rawField, clozeOrdinal, true);

        if (fieldNames.length > 1 && fieldMap[fieldNames[1]]){
          backHtml += '<hr>' + fieldMap[fieldNames[1]];
        }
      } else {
        frontHtml = fillTemplate(tmpl.qfmt, fieldMap);
        frontHtml = stripUnresolvedTags(frontHtml);

        let afmt = fillTemplate(tmpl.afmt, fieldMap);
        afmt = afmt.replace('__FRONTSIDE__', frontHtml);
        backHtml = stripUnresolvedTags(afmt);
      }

      frontHtml = rewriteMediaRefs(frontHtml, mediaUrlMap);
      backHtml = rewriteMediaRefs(backHtml, mediaUrlMap);

      cards.push({ id: cardRow.id, front: frontHtml, back: backHtml });
    }

    db.close();

    if (cards.length === 0){
      throw { code: 'NO_CARDS' };
    }

    return cards;
  }

  /* ---------------- flashcard UI ---------------- */
  function renderProgress(){
    if (!deckCards.length) return;
    progressRow.style.display = 'flex';
    const pct = ((currentIndex + 1) / deckCards.length) * 100;
    progressFill.style.width = pct + '%';
    progressCount.textContent = `${currentIndex + 1} / ${deckCards.length}`;
  }

  function renderStudyMode(){
    viewMode = 'study';
    updateModeCheckmarks();
    const card = deckCards[currentIndex];
    if (!card) return;

    mainEl.innerHTML = `
      <div class="study-view">
        <div class="card-stage">
          <div class="flip-card" id="flipCard">
            <div class="flip-card-inner" id="flipCardInner">
              <div class="flip-face face-front" id="frontFace">
                <div class="flip-face-label" data-en="Question" data-ar="السؤال">Question</div>
                <div class="flip-face-content" id="frontContent"></div>
              </div>
              <div class="flip-face face-back" id="backFace">
                <div class="flip-face-label" data-en="Answer" data-ar="الإجابة">Answer</div>
                <div class="flip-face-content" id="backContent"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="tap-hint" data-en="Tap the card to flip it" data-ar="اضغط على البطاقة عشان تقلبها">Tap the card to flip it</div>

        <div class="nav-row">
          <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="flip-btn" id="flipBtnMain">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4M3 12.9V9a4 4 0 014-4h14M7 21.9l-4-4 4-4M21 11.1V15a4 4 0 01-4 4H3"/></svg>
            <span data-en="Flip" data-ar="اقلب">Flip</span>
          </button>
          <button class="nav-btn nav-next" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    `;

    document.getElementById('frontContent').innerHTML = card.front;
    document.getElementById('backContent').innerHTML = card.back;

    const flipCard = document.getElementById('flipCard');

    // Tapping the card flips it — but not when the tap/click originated
    // from inside a scrolling gesture on the face content, and not while
    // a face is actively scrolled (so a scroll-then-release doesn't flip).
    flipCard.addEventListener('click', (e) => {
      flipCard.classList.toggle('is-flipped');
    });

    document.getElementById('flipBtnMain').addEventListener('click', (e) => {
      e.stopPropagation();
      flipCard.classList.toggle('is-flipped');
    });

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === deckCards.length - 1;
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goToCard(currentIndex - 1); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goToCard(currentIndex + 1); });

    applyStaticText(currentLang);
    renderProgress();

    // ---- swipe support: exactly one card per swipe gesture ----
    const stage = document.querySelector('.card-stage');
    let touchStartX = 0;
    let touchStartY = 0;
    let swipeHandled = false;

    stage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swipeHandled = false;
    }, { passive:true });

    stage.addEventListener('touchmove', (e) => {
      // Once we've already committed to a card change for this gesture,
      // ignore further movement so continuing to drag doesn't skip more cards.
      if (swipeHandled) return;
    }, { passive:true });

    stage.addEventListener('touchend', (e) => {
      if (swipeHandled || isAnimatingNav) return;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;

      // Require a clearly horizontal, deliberate swipe (ignore vertical
      // scrolling inside the card face, and ignore tiny jitters).
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.2) return;

      swipeHandled = true;
      const rtl = htmlEl.getAttribute('dir') === 'rtl';
      const goingNext = rtl ? dx > 0 : dx < 0;
      if (goingNext && currentIndex < deckCards.length - 1) goToCard(currentIndex + 1);
      else if (!goingNext && currentIndex > 0) goToCard(currentIndex - 1);
    }, { passive:true });
  }

  function goToCard(idx){
    if (idx < 0 || idx >= deckCards.length) return;
    if (isAnimatingNav) return;
    isAnimatingNav = true;
    currentIndex = idx;
    renderStudyMode();
    // Small guard window so a fast next-button double-click or a lingering
    // touch sequence can't advance more than one card at a time.
    setTimeout(() => { isAnimatingNav = false; }, 150);
  }

  function plainTextPreview(html){
    const div = document.createElement('div');
    div.innerHTML = html;
    div.querySelectorAll('img').forEach(img => img.replaceWith(currentLang==='ar' ? '📷 صورة' : '📷 Image'));
    div.querySelectorAll('audio').forEach(a => a.replaceWith(currentLang==='ar' ? '🔊 صوت' : '🔊 Audio'));
    const text = (div.textContent || '').replace(/\s+/g, ' ').trim();
    return text || (currentLang==='ar' ? '(بدون نص)' : '(no text)');
  }

  function renderBrowseMode(){
    viewMode = 'browse';
    updateModeCheckmarks();
    mainEl.innerHTML = `
      <div class="browse-view">
        <div class="card-list" id="cardListEl"></div>
      </div>
    `;
    const listEl = document.getElementById('cardListEl');
    listEl.innerHTML = deckCards.map((c, i) => `
      <div class="card-list-item" data-idx="${i}">
        <div class="card-list-num">${i+1}</div>
        <div class="card-list-text">${escapeHtml(plainTextPreview(c.front))}</div>
        <svg class="card-list-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `).join('');

    listEl.querySelectorAll('.card-list-item').forEach(item => {
      item.addEventListener('click', () => {
        currentIndex = parseInt(item.dataset.idx, 10);
        renderStudyMode();
      });
    });

    applyStaticText(currentLang);
    progressRow.style.display = 'none';
  }

  /* ---------------- init ---------------- */
  (async function init(){
    const storedLang = getStoredLang();
    if (storedLang) setLang(storedLang, true);
    else updateLangLabel();

    const materialId = getQueryParam('id');
    if (!materialId){
      renderErrorState(
        'No flashcard set specified', 'مفيش بطاقات محددة',
        'This link is missing the flashcard ID.', 'اللينك ده ناقصه رقم مجموعة البطاقات.'
      );
      return;
    }

    const { data: material, error: matErr } = await supabase
      .from('materials')
      .select('id, title, url, file_name, type')
      .eq('id', materialId)
      .single();

    if (matErr || !material){
      renderErrorState(
        'Flashcards not found', 'البطاقات مش موجودة',
        'This flashcard set may have been removed or the link is incorrect.',
        'ممكن مجموعة البطاقات دي اتشالت أو اللينك غلط.'
      );
      return;
    }

    deckTitle.textContent = material.title || (currentLang==='ar' ? 'بطاقات تعليمية' : 'Flashcards');
    deckSub.textContent = currentLang==='ar' ? 'بيتم فتح البطاقات…' : 'Opening the deck…';

    let arrayBuffer;
    try {
      const resp = await fetch(material.url);
      if (!resp.ok) throw new Error('fetch failed');
      arrayBuffer = await resp.arrayBuffer();
    } catch (e){
      renderErrorState(
        'Could not download the file', 'مقدرش يحمّل الملف',
        'The flashcard file could not be downloaded. Check your connection and try again.',
        'مقدرش يحمّل ملف البطاقات. اتأكد من النت وجرب تاني.'
      );
      return;
    }

    try {
      deckCards = await parseApkg(arrayBuffer);
    } catch (e){
      const code = (e && e.code) || 'UNKNOWN';
      if (code === 'LATEST_FORMAT'){
        renderErrorState(
          'Newer Anki format not supported yet',
          'نوع الملف الجديد مش مدعوم لسه',
          'This deck was exported in Anki\'s newest compressed format, which this viewer can\'t read yet.',
          'الملف ده اتصدّر بصيغة Anki الجديدة المضغوطة، والصفحة دي لسه مش عارفة تقراها.',
          'In Anki, re-export the deck and check "Support older Anki versions (slower/larger files)" before saving the .apkg, then re-upload it here.',
          'في Anki، صدّر الملف تاني واختار خيار "Support older Anki versions" قبل ما تحفظ ملف الـ.apkg، وبعدين ارفعه هنا تاني.'
        );
      } else if (code === 'NO_DB' || code === 'BAD_DB'){
        renderErrorState(
          'Couldn\'t read this file', 'مقدرش يقرا الملف ده',
          'This doesn\'t look like a valid Anki flashcard deck (.apkg) file.',
          'الملف ده مش شكله ملف بطاقات Anki (.apkg) صحيح.'
        );
      } else if (code === 'NO_CARDS'){
        renderErrorState(
          'This deck is empty', 'المجموعة دي فاضية',
          'No flashcards were found inside this file.',
          'مفيش بطاقات جوا الملف ده.'
        );
      } else {
        renderErrorState(
          'Something went wrong', 'حصل خطأ',
          'This flashcard file couldn\'t be opened. It may be corrupted or in an unsupported format.',
          'ملف البطاقات ده مقدرش يتفتح. ممكن يكون تالف أو بصيغة مش مدعومة.'
        );
      }
      return;
    }

    deckSub.textContent = currentLang==='ar'
      ? `${deckCards.length} بطاقة`
      : `${deckCards.length} card${deckCards.length===1?'':'s'}`;

    currentIndex = 0;
    renderStudyMode();
  })();
})();
