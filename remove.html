<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove PDF Pages</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; background: #f3f5f9; color: #1f2937;
  }
  header { background: #1e3a8a; color: #fff; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  #drop {
    border: 2px dashed #94a3b8; border-radius: 14px; background: #fff;
    padding: 34px; text-align: center; cursor: pointer; transition: .2s;
  }
  #drop.over { border-color: #1e3a8a; background: #eff6ff; }
  #drop strong { color: #1e3a8a; }
  #fileInput { display: none; }
  #tools { display: none; margin-top: 18px; background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row + .row { margin-top: 12px; }
  input[type=text] {
    flex: 1; min-width: 220px; padding: 10px 12px; font-size: 15px;
    border: 1px solid #cbd5e1; border-radius: 8px;
  }
  button {
    padding: 10px 16px; font-size: 14px; border: 0; border-radius: 8px;
    cursor: pointer; background: #e2e8f0; color: #1f2937; font-weight: 600;
  }
  button:hover { background: #cbd5e1; }
  button.primary { background: #dc2626; color: #fff; }
  button.primary:hover { background: #b91c1c; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { font-size: 14px; color: #475569; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px; margin-top: 18px;
  }
  .page {
    position: relative; background: #fff; border: 3px solid transparent;
    border-radius: 10px; padding: 8px; cursor: pointer; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.1); user-select: none;
  }
  .page canvas { width: 100%; height: auto; display: block; border-radius: 4px; background: #f1f5f9; min-height: 120px; }
  .page .num { margin-top: 6px; font-size: 13px; font-weight: 600; color: #475569; }
  .page.removed { border-color: #dc2626; }
  .page.removed canvas { opacity: .35; }
  .page.removed::after {
    content: "✕ REMOVE"; position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg);
    color: #dc2626; font-weight: 800; font-size: 18px;
    background: rgba(255,255,255,.9); padding: 4px 10px; border-radius: 6px;
    border: 2px solid #dc2626;
  }
  .error { color: #b91c1c; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Remove PDF Pages</h1>
  <p>Select the pages you don't want, then download the cleaned PDF. Everything stays on your device.</p>
</header>

<main>
  <div id="drop">
    <p><strong>Click to choose a PDF</strong> or drag and drop it here</p>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <div id="tools">
    <div class="row">
      <input type="text" id="rangeInput" placeholder="Type pages to remove, e.g. 1-3, 7, 10-12">
      <button id="applyRange">Apply</button>
    </div>
    <div class="row">
      <button id="clearBtn">Clear selection</button>
      <button id="invertBtn">Invert selection</button>
      <button id="removeBtn" class="primary" disabled>Remove selected pages &amp; download</button>
    </div>
    <div class="row"><span id="status"></span></div>
  </div>

  <div id="grid"></div>
</main>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("fileInput");
  const tools = document.getElementById("tools");
  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  const rangeInput = document.getElementById("rangeInput");
  const removeBtn = document.getElementById("removeBtn");

  let pdfBytes = null;
  let fileName = "document.pdf";
  let totalPages = 0;
  let selected = new Set();
  let loadToken = 0;

  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => {
    const f = e.dataTransfer.files[0];
    if (f && f.type === "application/pdf") loadFile(f);
    else setStatus("Please drop a PDF file.", true);
  });

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  async function loadFile(file) {
    const token = ++loadToken;
    fileName = file.name;
    selected.clear();
    grid.innerHTML = "";
    rangeInput.value = "";
    tools.style.display = "block";
    setStatus("Loading PDF…");
    try {
      pdfBytes = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
      totalPages = pdf.numPages;

      // Create placeholders first so the grid appears right away
      const canvases = [];
      for (let i = 1; i <= totalPages; i++) {
        const div = document.createElement("div");
        div.className = "page";
        div.dataset.page = i;
        const canvas = document.createElement("canvas");
        canvas.width = 150; canvas.height = 200;
        const num = document.createElement("div");
        num.className = "num";
        num.textContent = "Page " + i;
        div.append(canvas, num);
        div.addEventListener("click", () => toggle(i));
        grid.appendChild(div);
        canvases.push(canvas);
      }
      updateUI();

      // Render thumbnails one by one
      for (let i = 1; i <= totalPages; i++) {
        if (token !== loadToken) return;
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const scale = 220 / base.width;
        const vp = page.getViewport({ scale });
        const canvas = canvases[i - 1];
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      }
    } catch (err) {
      console.error(err);
      setStatus("Could not read this PDF. It may be corrupted or password-protected.", true);
    }
  }

  function toggle(n) {
    if (selected.has(n)) selected.delete(n); else selected.add(n);
    updateUI();
  }

  function updateUI() {
    grid.querySelectorAll(".page").forEach(el => {
      el.classList.toggle("removed", selected.has(Number(el.dataset.page)));
    });
    const keep = totalPages - selected.size;
    setStatus(`${totalPages} pages total · ${selected.size} selected for removal · ${keep} will remain`);
    removeBtn.disabled = selected.size === 0 || keep === 0;
    rangeInput.value = toRangeString([...selected].sort((a, b) => a - b));
  }

  function toRangeString(arr) {
    const parts = [];
    let i = 0;
    while (i < arr.length) {
      let j = i;
      while (j + 1 < arr.length && arr[j + 1] === arr[j] + 1) j++;
      parts.push(j > i ? `${arr[i]}-${arr[j]}` : `${arr[i]}`);
      i = j + 1;
    }
    return parts.join(", ");
  }

  function parseRange(text) {
    const result = new Set();
    const parts = text.split(/[,\s;]+/).filter(Boolean);
    for (const p of parts) {
      const m = p.match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
      if (!m) throw new Error(`"${p}" isn't a valid page or range.`);
      let a = parseInt(m[1], 10);
      let b = m[2] ? parseInt(m[2], 10) : a;
      if (a > b) [a, b] = [b, a];
      if (a < 1 || b > totalPages) throw new Error(`Pages must be between 1 and ${totalPages}.`);
      for (let n = a; n <= b; n++) result.add(n);
    }
    return result;
  }

  document.getElementById("applyRange").addEventListener("click", () => {
    try {
      selected = parseRange(rangeInput.value);
      updateUI();
    } catch (e) {
      setStatus(e.message, true);
    }
  });
  rangeInput.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("applyRange").click();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    selected.clear(); updateUI();
  });

  document.getElementById("invertBtn").addEventListener("click", () => {
    const next = new Set();
    for (let i = 1; i <= totalPages; i++) if (!selected.has(i)) next.add(i);
    selected = next; updateUI();
  });

  removeBtn.addEventListener("click", async () => {
    removeBtn.disabled = true;
    setStatus("Creating new PDF…");
    try {
      const { PDFDocument } = PDFLib;
      const doc = await PDFDocument.load(pdfBytes, { ignoreEncryption: true });
      // Remove from the end so page numbers don't shift
      [...selected].sort((a, b) => b - a).forEach(n => doc.removePage(n - 1));
      const out = await doc.save();
      const blob = new Blob([out], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName.replace(/\.pdf$/i, "") + "-edited.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      setStatus(`Done! Downloaded a ${totalPages - selected.size}-page PDF.`);
    } catch (err) {
      console.error(err);
      setStatus("Something went wrong while creating the PDF.", true);
    }
    removeBtn.disabled = false;
  });
</script>
</body>
</html>
