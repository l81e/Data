  function renderRules() {
    const p = (stance) => ({ side: "ivory", stance, king: false }), enemy = { side: "onyx", stance: "diagonal", king: false };
    root.innerHTML = `${header("rules")}<main class="shell"><div class="rules-head"><div class="eyebrow">The Crosswake rulebook</div><h1>Learn the changing angles.</h1><p>A capture game for two players. No dice, hidden information, or random events. Every step changes what a piece can do next.</p></div><div class="rules-layout"><nav class="rules-nav" aria-label="Rule sections">${[["objective", "Objective & setup"], ["movement", "Movement"], ["captures", "Capturing"], ["crowns", "Crowns"], ["wells", "Wake wells"], ["ending", "Ending a game"], ["strategy", "Strategy"]].map(([id, title]) => `<a href="#${id}">${title}</a>`).join("")}</nav><div><section class="rule-section" id="objective"><h2>01 \xB7 Objective & setup</h2><p>Win by capturing all opposing pieces, or leaving your opponent with no legal action on their turn.</p><p>The board is <strong>7 \xD7 7, and every square is playable</strong>. Ivory starts on ranks 1 and 2 and travels toward rank 7. Onyx starts on ranks 7 and 6 and travels toward rank 1. Each side has <strong>10 runners</strong>: seven diagonal runners across its back rank, and three orthogonal runners on files B, D, and F in the next rank. Ivory moves first.</p>${boardHTML(createInitialState(), { static: true, flipped: false })}<p>The \xD7 or + on each piece shows its current stance. Gold diamonds mark the three wake wells on B4, D4, and F4. The checkerboard colors help you read the board; they do not restrict movement.</p></section><section class="rule-section" id="movement"><h2>02 \xB7 Move, then switch</h2><p>A quiet move is one step into an empty square. A runner cannot step backward. <strong>After every step, the moving piece switches stance</strong>: diagonal becomes orthogonal, and orthogonal becomes diagonal.</p><div class="diagram-pair"><div class="diagram"><h3>Diagonal stance \xD7</h3>${miniBoard({ 17: p("diagonal") }, [11, 13], 17)}<p>Ivory can step one square diagonally forward. It becomes + after the step.</p></div><div class="diagram"><h3>Orthogonal stance +</h3>${miniBoard({ 17: p("orthogonal") }, [12, 16, 18], 17)}<p>Ivory can step forward, left, or right. It becomes \xD7 after the step.</p></div></div><p>Onyx follows the same rules in the opposite forward direction. No piece can step onto an occupied square. You cannot pass.</p></section><section class="rule-section" id="captures"><h2>03 \xB7 Combinations that turn corners</h2><p>A capture jumps over one <strong>adjacent enemy</strong> onto the empty square immediately beyond it. A diagonal piece jumps along a diagonal; an orthogonal piece jumps along a rank or file. <strong>Runners can capture backward.</strong> Remove the jumped piece immediately, then switch the jumping piece\u2019s stance.</p><div class="diagram-pair"><div class="diagram"><h3>A single diagonal jump</h3>${miniBoard({ 16: p("diagonal"), 12: enemy }, [8], 16, { 8: 1 })}<p>Jump over the enemy. Land two squares away and become orthogonal.</p></div><div class="diagram"><h3>A turning combination</h3>${miniBoard({ 20: p("diagonal"), 16: enemy, 13: enemy }, [12, 14], 20, { 12: 1, 14: 2 })}<p>First jump diagonally to 1. Then jump horizontally to 2. After both jumps, the piece is diagonal again.</p></div></div><div class="rule-panel"><p><strong>Capturing is compulsory across your whole side.</strong> If any piece can capture, you cannot take a quiet step or pivot. Choose a capturing piece and complete its route.</p><p><strong>Keep jumping with the same piece</strong> while a capture is available in its new stance. You may choose between branches, including a shorter complete route. You cannot stop early, change pieces halfway through, or jump your own pieces.</p><p class="last-paragraph">A previously visited square may be revisited if empty. A captured piece is gone and cannot be captured again.</p></div><p class="rule-note">On the board, click each highlighted landing square in order. Gold highlights are capture destinations. The whole combination is submitted as one turn.</p></section><section class="rule-section" id="crowns"><h2>04 \xB7 Earn a Crown</h2><p>A runner <strong>finishing its full turn on the far rank</strong> becomes a Crown: rank 7 for Ivory, rank 1 for Onyx. The gold crown symbol marks it.</p><p>A Crown can step one square in <strong>any direction allowed by its current stance</strong>, including backward. It still switches stance after every step or jump. Crowns do not slide across the board. Captures work exactly as they do for runners.</p><p class="rule-note">Promotion waits until a combination ends. If a runner touches the far rank mid-combination and then leaves it, it does not become a Crown. Even on the far rank, it must continue any available jump.</p></section><section class="rule-section" id="wells"><h2>05 \xB7 Wake wells</h2><p>B4, D4, and F4 are wake wells. A piece standing on one may <strong>spend its turn switching stance in place</strong>. This action is called a pivot. It does not move the piece or capture anything.</p><p>You may pivot only when your side has no capture. A pivot can make a blocked runner mobile again, prepare a threat, or lose a tempo deliberately. Wells give no immunity from capture, and entering one does not trigger an extra switch.</p><p>Select a piece on a well to see the <strong>Pivot</strong> button when the action is legal. A pivot counts toward the quiet-turn draw limit.</p></section><section class="rule-section" id="ending"><h2>06 \xB7 Winning & drawing</h2><ul><li><strong>Elimination:</strong> your opponent has no pieces.</li><li><strong>Immobility:</strong> your opponent has no legal action, including no legal well pivot. This is a loss for that player.</li><li><strong>Resignation:</strong> a player concedes the game.</li><li><strong>Repetition draw:</strong> the identical position occurs three times, not necessarily consecutively. Piece side, square, Crown status, stance, and whose turn it is must all match.</li><li><strong>Quiet draw:</strong> 80 individual player turns pass without a capture or promotion. Either event resets the counter.</li><li><strong>Agreement:</strong> in online play, offer a draw and let the opponent accept it.</li></ul><p>A win takes precedence if the final move would also trigger a draw. Crosswake has no automatic \u201Cone Crown each\u201D draw: stance, wells, and position can still matter.</p><p>Online games are untimed. Losing your connection does not forfeit the game. Reopen the same link in the same browser to reclaim your seat. A room expires after 24 hours without a join or game action. If you clear browser cookies, your private seat cannot be recovered.</p></section><section class="rule-section" id="strategy"><h2>07 \xB7 Think one stance ahead</h2><p><strong>Material is only part of the position.</strong> Ask what stance each piece will have after its next action. A move that gains space can leave its next step blocked; a sacrifice can force an opponent through a dangerous turn in a capture chain.</p><p><strong>Control the wells.</strong> A pivot gives flexibility but consumes a full turn. That makes tempo, blockades, and zugzwang meaningful even in small endgames. Crowns gain freedom, but their alternating geometry keeps them from dominating every line.</p><p>For serious analysis, record moves using coordinates: <strong>B2\u2013B3</strong> is a quiet step, <strong>A3\xD7C5\xD7E5</strong> is a combination, and <strong>D4 \u21BB</strong> is a pivot. The first individual turn is always Ivory\u2019s.</p><button class="btn primary" data-action="start-local">Try a local game</button></section></div></div></main>${footer()}`;
  }

    history = readJSON("cw-history", []);
    const computer = history.filter((h) => h.mode === "computer"), wins = computer.filter((h) => h.result.winner === h.role).length;
    root.innerHTML = `${header("history")}<main class="shell"><div class="eyebrow">Your games</div><h1 class="history-heading">History & statistics</h1><p class="muted top-gap">The last 30 completed games are saved in this browser, with a replay of every move.</p><div class="stats-grid"><div class="stat-box"><strong>${history.length}</strong><span>Completed games</span></div><div class="stat-box"><strong>${wins}</strong><span>Wins vs. computer</span></div><div class="stat-box"><strong>${history.filter((h) => !h.result.winner).length}</strong><span>Draws</span></div><div class="stat-box"><strong>${history.length ? Math.round(history.reduce((sum, h) => sum + h.ply, 0) / history.length) : "\u2014"}</strong><span>Average turns</span></div></div><div class="history-actions"><h2 class="history-subheading">Recent matches</h2>${history.length ? '<button class="btn flat" data-action="clear-history">Clear history</button>' : ""}</div>${history.length ? `<div class="history-list">${history.map((h) => `<div class="history-row"><div><div class="history-title">${modeNames[h.mode] || "Crosswake"}</div><div class="history-sub">${new Date(h.endedAt).toLocaleDateString(void 0, { month: "short", day: "numeric", year: "numeric" })} \xB7 ${h.ply} turns</div></div><span class="muted small">${h.result.reason === "resignation" ? "Resignation" : h.result.reason === "agreement" ? "Agreed draw" : h.result.reason === "quiet-limit" ? "80 quiet turns" : h.result.reason}</span><span class="history-result ${!h.result.winner ? "history-draw" : ""}">${h.result.winner ? `${names[h.result.winner]} won` : "Draw"}</span><a class="btn" data-route href="/replay/${encodeURIComponent(h.id)}">Replay</a></div>`).join("")}</div>` : '<div class="empty-state"><h2>No completed games yet</h2><p class="top-gap">Finish a game to see its result and replay here.</p><a href="/" class="btn primary" data-route>Start playing</a></div>'}</main>${footer()}`;
  }
  function renderLoading(error = null) {
    root.innerHTML = `${header()}<main class="shell"><div class="empty-state">${error ? "" : '<div class="spinner"></div>'}<h1>${error ? "Unable to open this room" : "Opening your game\u2026"}</h1><p>${error ? escapeHTML(error) : "Claiming your seat and connecting the board."}</p>${error ? '<button class="btn primary" data-action="retry-room">Try again</button><a class="btn flat" href="/" data-route>Return to lobby</a>' : ""}</div></main>${footer()}`;
  }
  function navigate(path, provided = null) {
    path = path.replace(/^#/, "");
    window.history.pushState({}, "", fileEdition ? "#" + path : path);
    route(provided);
    window.scrollTo({ top: 0 });
  }
  async function route(provided = null) {
    const generation = ++routeGeneration;
    leaveConnection();
    stopAI();
    selection = null;
    replay = null;
    loadingError = null;
    const rawPath = fileEdition ? location.hash.startsWith("#/") ? location.hash.slice(1).split("?")[0] : "/" : location.pathname;
    const path = rawPath.replace(/\/$/, "") || "/";
    if (path === "/") {
      match = null;
      renderLobby();
      return;
    }
    if (path === "/rules") {
      renderRules();
      return;
    }
    if (path === "/history") {
      renderHistory();
      return;
    }
    if (path.startsWith("/replay/")) {
      const entry = history.find((h) => h.id === decodeURIComponent(path.slice(8)));
      if (!entry) {
        renderLoading("This replay is no longer saved in this browser.");
        return;
      }
      replay = { entry, index: 0 };
      match = { mode: entry.mode, role: entry.role, state: createInitialState(), moves: [] };
      if (!entry.moves.length) match.state.result = entry.result;
      renderGame();
      return;
    }
    if (path === "/play/local" || path === "/play/computer") {
      const mode = path.split("/")[2], saved = readJSON("cw-active", null);
      if (provided) match = provided;
      else if (saved?.match?.mode === mode && isValidState(saved.match.state)) {
        match = saved.match;
        localUndo = saved.undo || [];
      } else {
        match = { mode, role: mode === "local" ? "both" : "ivory", state: createInitialState(), version: 0, moves: [], historyId: newLocalId(), players: { ivory: true, onyx: true } };
        localUndo = [];
      }
      renderGame();
      queueAI();
      return;
    }
    const id = /^\/game\/([A-Za-z0-9_-]{8,64})$/.exec(path)?.[1];
    if (id) {
      if (fileEdition) {
        match = null;
        renderLoading("Online rooms need the separate Crosswake.backend.mjs server. Open its web address to join an invite.");
        return;
      }
      renderLoading();
      try {
        const snapshot = provided || await api(`/api/rooms/${id}/join`, { spectate: new URLSearchParams(location.search).get("spectate") === "1" });
        if (generation !== routeGeneration) return;
        match = { mode: "online", round: 0, ...snapshot };
        connectRoom(generation);
      } catch (error) {
        if (generation !== routeGeneration) return;
        loadingError = error.message;
        match = null;
        renderLoading(error.name === "TimeoutError" ? "The server is taking a while to respond. Try again shortly." : error.message);
      }
      return;
    }
    match = null;
    renderLoading("This page does not exist. Use the lobby to start a game.");
  }
  async function copyLink(spectate = false) {
    const link = `${location.origin}/game/${match.roomId}${spectate ? "?spectate=1" : ""}`;
    try {
      await navigator.clipboard.writeText(link);
      showToast(spectate ? "Spectator link copied." : "Invite copied. Send it to your friend.");
    } catch {
      const input = document.querySelector(".invite-link input");
      input.value = link;
      input.focus();
      input.select();
      showToast("Select and copy the link shown above.");
    }
  }
  root.addEventListener("click", (event) => {
    const square = event.target.closest("[data-square]");
    if (square) {
      chooseSquare(Number(square.dataset.square));
      return;
    }
    const link = event.target.closest("[data-route]");
    if (link && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
      event.preventDefault();
      navigate(link.getAttribute("href"));
      return;
    }
    const action = event.target.closest("[data-action]")?.dataset.action;
    switch (action) {
      case "sound":
        sound = !sound;
        saveJSON("cw-sound", sound);
        if (sound) playSound();
        {
          const button = document.querySelector(".sound");
          button.innerHTML = icon(sound ? "sound" : "mute");
          button.setAttribute("aria-pressed", sound);
          button.setAttribute("aria-label", sound ? "Mute sound" : "Enable sound");
          button.title = sound ? "Mute sound" : "Enable sound";
        }
        break;
      case "create-online":
        createOnline();
        break;
      case "start-computer":
        computerDialog();
        break;
      case "start-local":
        beginLocal("local");
        break;
      case "pivot": {
        const move = selection?.options.find((m) => m.kind === "pivot");
        if (move && canPlay()) commitMove(move);
        break;
      }
      case "cancel-selection":
        selection = null;
        renderGame();
        break;
      case "undo":
        undoMove();
        break;
      case "restart":
        modal("Restart this game?", "The current position will be cleared. Start again with the same settings.", "restart", "Restart game");
        break;
      case "new-game":
        modal("Start a new game?", "The current local game will be cleared. Return to the lobby to choose a new mode.", "lobby-clear", "New game");
        break;
      case "lobby":
        if (match?.mode === "computer") persistLocal();
        navigate("/");
        break;
      case "resign":
        modal("Resign this game?", `${names[match.mode === "local" ? match.state.turn : match.role]} will concede. The result will be saved in your history.`, "resign", "Resign");
        break;
      case "rematch":
        if (match.mode === "online") sendOnline("rematch");
        else beginLocal(match.mode, match.mode === "computer" ? opposite(match.role) : "both");
        break;
      case "draw":
        sendOnline("draw");
        break;
      case "copy-invite":
        copyLink();
        break;
      case "copy-spectate":
        copyLink(true);
        break;
      case "reconnect":
        connectRoom(routeGeneration);
        break;
      case "retry-room":
        route();
        break;
      case "clear-history":
        modal("Clear your game history?", "This removes the results and replays stored in this browser.", "clear-history", "Clear history");
        break;
      case "replay-prev":
      case "replay-next": {
        replay.index += action === "replay-prev" ? -1 : 1;
        match.state = createInitialState();
        match.moves = replay.entry.moves.slice(0, replay.index);
        for (const move of match.moves) match.state = applyMove(match.state, move);
        if (replay.index === replay.entry.moves.length) match.state.result = replay.entry.result;
        renderGame();
        break;
      }
    }
  });
  dialog.addEventListener("click", (event) => {
    const action = event.target.closest("[data-dialog]")?.dataset.dialog;
    if (!action) return;
    const side = dialog.querySelector("#computer-side")?.value, level = dialog.querySelector("#computer-level")?.value;
    dialog.close();
    if (action === "begin-computer") {
      difficulty = level;
      saveJSON("cw-difficulty", difficulty);
      beginLocal("computer", side);
    }
    if (action === "restart") beginLocal(match.mode, match.role);
    if (action === "lobby-clear") {
      saveJSON("cw-active", null);
      navigate("/");
    }
    if (action === "resign") resign();
    if (action === "clear-history") {
      history = [];
      saveJSON("cw-history", history);
      renderHistory();
    }
  });
  root.addEventListener("change", (event) => {
    if (event.target.id === "difficulty") {
      difficulty = event.target.value;
      saveJSON("cw-difficulty", difficulty);
      if (thinking) {
        stopAI();
        queueAI();
      }
    }
  });
  root.addEventListener("keydown", (event) => {
    const square = event.target.closest("[data-square]");
    if (!square) return;
    const delta = { ArrowUp: -7, ArrowDown: 7, ArrowLeft: -1, ArrowRight: 1 }[event.key];
    if (delta !== void 0) {
      event.preventDefault();
      const i = Number(square.dataset.square), dest = i + (match?.role === "onyx" ? -delta : delta);
      if (dest >= 0 && dest < 49) document.querySelector(`[data-square="${dest}"]`)?.focus();
    }
    if (event.key === "Escape") {
      selection = null;
      renderGame();
    }
  });
  window.addEventListener("popstate", () => route());
  if (fileEdition) {
    window.addEventListener("hashchange", () => route());
    const normalize = () => {
      for (const link of root.querySelectorAll("[data-route]")) {
        const href = link.getAttribute("href");
        if (href?.startsWith("/")) link.setAttribute("href", "#" + href);
      }
    };
    new MutationObserver(normalize).observe(root, { childList: true, subtree: true });
    root.addEventListener("click", (event) => {
      const link = event.target.closest(".rules-nav a");
      if (link) {
        event.preventDefault();
        document.getElementById(link.getAttribute("href").slice(1))?.scrollIntoView({ behavior: "smooth" });
      }
    });
  }
  window.addEventListener("online", () => {
    if (match?.mode === "online" && connection !== "connected") connectRoom(routeGeneration);
  });
  var unregisterGameTools = registerGameTools(() => match ? { mode: match.mode, role: match.role, version: match.version, state: structuredClone(match.state), legalMoves: getLegalMoves(match.state) } : { mode: "lobby" });
  window.addEventListener("pagehide", () => {
    unregisterGameTools();
    stopAI();
    leaveConnection();
  });
  window.addEventListener("pageshow", (event) => {
    if (event.persisted) route();
  });
  route();
})();
</script>
</body></html>
